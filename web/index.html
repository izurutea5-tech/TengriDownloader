    <div class="ext-only setting"><div>Suwayomi серверийн хаяг</div><input type="text" id="s_swu" style="width:420px" value="${esc(s.suwayomi_url)}"></div>
    <div class="ext-only setting"><div><div>Нэвтрэх нэр / нууц үг</div><div class="muted">Нэвтрэлт асаагаагүй бол хоосон орхи</div></div>
      <div class="row"><input type="text" id="s_swn" style="width:200px" value="${esc(s.suwayomi_user)}" placeholder="нэр"><input type="password" id="s_swp" style="width:200px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px" value="" placeholder="нууц үг (өөрчлөхгүй бол хоосон)"></div></div>
    <div class="int-only setting"><div><div>Порт / санах ой</div><div class="muted">Suwayomi (4567)-оос өөр порт</div></div><div class="row"><input type="number" id="s_ep" style="width:100px" value="${s.engine_port}"><input type="text" id="s_em" style="width:100px" value="${esc(s.engine_memory)}"></div></div>
    <div style="margin-top:18px"><button class="btn fill" id="s_save">Хадгалах</button></div>`;

  const save = async (quiet) => {
    await api('/settings', {method: 'POST', body: {download_dir: $('#s_dir').value.trim(), cbz: $('#s_cbz').checked, chapter_workers: +$('#s_cw').value, page_workers: +$('#s_pw').value, auto_download_new: $('#s_auto').checked, auto_update_hours: +$('#s_upd').value,
      suwayomi_url: $('#s_swu').value.trim(), suwayomi_user: $('#s_swn').value.trim(), suwayomi_pass: $('#s_swp').value,
      engine_mode: $('#s_mode').value, engine_port: +$('#s_ep').value || 4580, engine_memory: $('#s_em').value.trim() || '1024m'}});
    if (!quiet) toast('Хадгаллаа');
  };
  (async () => {
    const u = await api('/update').catch(() => null);
    if (!u) return;
    $('#s_autoupd').checked = u.auto; $('#s_autoinst').checked = u.auto_install; $('#s_feed').value = (u.feed === 'github:izurutea5-tech/TengriDownloader' ? '' : u.feed);
    const setVer = () => { const l = u.latest; $('#verInfo').innerHTML = `Tengri Downloader <b>${esc(u.current)}</b>` + (u.frozen ? ' · (exe/app)' : '') + (l ? (l.available ? ` · <span style="color:var(--pink2)">шинэ ${esc(l.version)} гарсан</span>` : ' · <span class="ok">хамгийн сүүлийн ✓</span>') : (u.error ? ` · <span class="err">${esc(u.error)}</span>` : '')); };
    setVer();
    if (u.latest && u.latest.available) $('#s_chk').textContent = 'Шинэчлэх…';
    $('#s_chk').onclick = async () => { $('#s_chk').disabled = true; $('#verInfo').innerHTML = 'Tengri Downloader · шалгаж байна…';
      try { await api('/update', {method: 'POST', body: {feed: $('#s_feed').value.trim(), auto: $('#s_autoupd').checked}}); } catch (e) {}
      window._upd = await api('/update?check=1'); $('#s_chk').disabled = false;
      if (window._upd.latest && window._upd.latest.available) { showUpdateModal(); } else { const uu = window._upd; $('#verInfo').innerHTML = `Tengri Downloader <b>${esc(uu.current)}</b> · ` + (uu.error ? `<span class="err">${esc(uu.error)}</span>` : '<span class="ok">хамгийн сүүлийн ✓</span>'); } };
    $('#s_autoupd').onchange = $('#s_autoinst').onchange = $('#s_feed').onchange = () => api('/update', {method: 'POST', body: {feed: $('#s_feed').value.trim(), auto: $('#s_autoupd').checked, auto_install: $('#s_autoinst').checked}});
  })();
  const accDraw = () => document.querySelectorAll('#s_acc a').forEach(a => a.classList.toggle('on', a.dataset.k === pref('accent', 'cyan')));
  $('#s_acc').onclick = e => { const a = e.target.closest('a'); if (a) { setPref('accent', a.dataset.k); applyTheme(); accDraw(); } }; accDraw();
  const bk = async () => { const b = await api('/backup'); $('#bkList').innerHTML = b.files.map(f => `<option value="${esc(f)}">`).join(''); $('#bkInfo').textContent = b.files.length ? 'Сүүлийн нөөц: ' + b.files[0] : 'Хавтас: ' + b.dir; };
  bk(); api('/cache').then(c => $('#cacheInfo').textContent = (c.bytes / 1048576).toFixed(0) + ' MB — хавтас, уншсан хуудасны түр хуулбар');
  $('#s_bk').onclick = async () => { const r = await api('/backup', {method: 'POST'}); toast('Нөөц үүслээ: ' + r.path, 6000); bk(); };
  $('#s_rsb').onclick = async () => { const p = $('#s_rs').value.trim(); if (!p) return toast('Нөөц файлын замаа оруулна уу'); if (!confirm('Одоогийн номын сан, түүхийг нөөцөөр солих уу?')) return;
    try { const r = await api('/restore', {method: 'POST', body: {path: p}}); toast(`Сэргээлээ — номын санд ${r.library} манга`, 5000); } catch (e) { toast('Алдаа: ' + e.message, 6000); } };
  $('#s_cc').onclick = async () => { await api('/cache', {method: 'DELETE'}); $('#cacheInfo').textContent = '0 MB'; toast('Кэш цэвэрлэгдлээ'); };
  $('#s_save').onclick = async () => { const modeChanged = $('#s_mode').value !== s.engine_mode; await save(); if (modeChanged) { await api('/engine/restart', {method: 'POST'}); } };
  const modeVis = () => { const ext = $('#s_mode').value === 'external'; V.querySelectorAll('.ext-only').forEach(e => e.hidden = !ext); V.querySelectorAll('.int-only').forEach(e => e.hidden = ext); };
  $('#s_mode').onchange = modeVis; modeVis();
  const my = gen;
  const drawEng = async () => {
    if (my !== gen) return;
    const e = await api('/engine'); const box = $('#engBox'); if (!box) return;
    const col = {running: 'var(--ok)', starting: 'var(--pink2)', external: 'var(--ok)'}[e.status] || 'var(--err)';
    const label = {running: 'Ажиллаж байна', starting: 'Асаж байна…', stopped: 'Зогссон', missing: 'Олдсонгүй', error: 'Алдаа', external: 'Гадаад сервер'}[e.status] || e.status;
    const imp = e.import;
    box.innerHTML = `<div class="setting"><div><div>Төлөв: <b style="color:${col}">● ${label}</b></div><div class="muted">${esc(e.message || '')}</div>
        ${e.found.jar ? `<div class="muted">Хөдөлгүүр: ${esc(e.found.folder)}</div>` : ''}<div class="muted">${esc(e.url)}</div></div>
        <div class="row">${e.mode === 'builtin' ? (e.status === 'running' || e.status === 'starting' ? `<button class="btn ghost" onclick="api('/engine/restart',{method:'POST'})">Дахин асаах</button><button class="btn ghost" onclick="api('/engine/stop',{method:'POST'})">Зогсоох</button>` : `<button class="btn fill" onclick="api('/engine/start',{method:'POST'})">Асаах</button>`) : ''}</div></div>
      ${e.mode === 'builtin' ? (() => {
        const mb = n => (n / 1048576).toFixed(n > 104857600 ? 0 : 1);
        const pr = imp && imp.running ? `<div style="margin-top:8px"><div class="muted">${esc(imp.phase || '')}${imp.total ? (imp.kind === 'download' && imp.phase.includes('татаж') ? ` — ${mb(imp.done)} / ${mb(imp.total)} MB` : ` — ${imp.done}/${imp.total}`) : '…'}</div>
            <div class="bar" style="max-width:420px"><i style="width:${imp.total ? Math.round(imp.done / imp.total * 100) : 5}%"></i></div></div>` : '';
        const res = imp && !imp.running ? `<div class="${imp.error ? 'err' : 'muted'}" style="margin-top:6px">${imp.error ? esc(imp.error) : imp.ok ? 'Суулгалт амжилттай ✓' : ''}</div>` : '';
        const ex = {windows: 'C:\\Users\\…\\Downloads\\Suwayomi-Server-v2.4.2366-windows-x64.zip', macos: '~/Downloads/Suwayomi-Server-v2.4.2366-macOS-arm64.tar.gz', linux: '~/Downloads/Suwayomi-Server-v2.4.2366-linux-x64.tar.gz'}[e.platform] || '';
        return `<div class="setting"><div style="flex:1"><div>Хөдөлгүүр суулгах / шинэчлэх</div>
            <div class="muted">${e.found.jar ? 'Одоогийн: ' + esc(e.found.folder) + (e.found.java ? '' : ` · <span class="err">Java ${e.java_min}+ алга</span>`) : 'Хөдөлгүүр суугаагүй байна.'}</div>
            <div class="muted">«Автоматаар татах» нь GitHub-аас Suwayomi-ийн сүүлийн хувилбарыг (Java байхгүй бол Java 21-тэй хамт) татаж суулгана — ${esc(e.platform)} дээр ажиллана.</div>${pr}${res}</div>
          <div class="row">${imp && imp.running ? `<button class="btn ghost" onclick="api('/engine/cancel',{method:'POST'})">Цуцлах</button>` : `<button class="btn fill" onclick="engDl()">⬇ Автоматаар татах</button>`}</div></div>
        <div class="setting"><div><div>Эсвэл гараар заах</div><div class="muted">Suwayomi-ийн хавтас, .zip (Windows), .tar.gz (Mac/Linux) эсвэл Suwayomi-Server.jar</div></div>
          <div class="row"><input type="text" id="impPath" style="width:330px" placeholder="${esc(ex)}">
          <button class="btn ghost" onclick="pickEng('folder')">Хавтас…</button><button class="btn ghost" onclick="pickEng('zip')">Файл…</button><button class="btn" onclick="impEng()">Суулгах</button></div></div>`;
      })() : ''}`;
    if (e.status === 'starting' || (imp && imp.running)) { clearTimeout(timer); timer = setTimeout(drawEng, 1500); }
  };
  window.engDl = async () => { try { await api('/engine/download', {method: 'POST'}); drawEng(); } catch (e) { toast('Алдаа: ' + e.message, 6000); } };
  window.pickEng = async kind => { try { const r = await api('/pick', {method: 'POST', body: {kind}}); if (r.path) { $('#impPath').value = r.path; } } catch (e) { toast(e.message); } };
  window.impEng = async () => { const p = $('#impPath').value.trim(); if (!p) return toast('Замаа оруулна уу'); try { await api('/engine/import', {method: 'POST', body: {path: p}}); drawEng(); } catch (e) { toast('Алдаа: ' + e.message, 6000); } };
  window.drawEng = drawEng;
  drawEng();
  V.addEventListener('click', e => { if (e.target.closest('#engBox button')) setTimeout(drawEng, 600); });
};

// ---------------- badges ----------------
async function badges() {
  try {
    const {jobs} = await api('/queue'); const n = jobs.filter(j => j.status === 'queued' || j.status === 'downloading').length;
    $('#dlBadge').hidden = !n; $('#dlBadge').textContent = n;
    const lib = await api('/library'); const u = lib.reduce((a, m) => a + (m.new || 0), 0);
    $('#updBadge').hidden = !u; $('#updBadge').textContent = u;
  } catch {}
}
async function engDot() {
  try { const e = await api('/engine'); const c = {running: 'var(--ok)', external: 'var(--ok)', starting: 'var(--pink2)'}[e.status] || 'var(--err)';
    $('#engDot').innerHTML = `<span style="color:${c}">●</span> Хөдөлгүүр: ${({running: 'ажиллаж байна', starting: 'асаж байна…', external: 'гадаад', stopped: 'зогссон', missing: 'тохируулаагүй', error: 'алдаа'})[e.status] || e.status}`; } catch {}
}
const ACCENTS = {cyan: ['#3fe3ff', '#9af1ff'], yellow: ['#ffc93a', '#ffe08a'], pink: ['#ff4fa3', '#ff9ccb'], violet: ['#8e6bff', '#b7a0ff'], blue: ['#3d8bff', '#82b6ff'], teal: ['#14b8a0', '#5fe0cb'], orange: ['#f5803c', '#ffae7d'], red: ['#f0485a', '#ff8794']};
function applyTheme() { const c = ACCENTS[pref('accent', 'cyan')] || ACCENTS.cyan; document.documentElement.style.setProperty('--pink', c[0]); document.documentElement.style.setProperty('--pink2', c[1]); }
applyTheme();
async function checkUpdate(opts = {}) {
  let u;
  try { u = await api('/update' + (opts.force ? '?check=1' : '')); } catch (e) { return null; }
  window._upd = u;
  const bar = $('#updbar');
  // Асах үед шалгалт хийгдээгүй бол нэг удаа албадаж шалгуулна
  if (u.auto && !u.latest && !u.error && !u.checking && !u.busy && !opts.force && !opts._retry) { return checkUpdate({force: true, _retry: true}); }
  if (u.checking && !opts._wait) { setTimeout(() => checkUpdate({_wait: true}), 1500); }
  const installing = u.busy && u.mode === 'install';
  if (installing) { // суулгаж байх үед дэвшлийг тасралтгүй шалгана
    if (!document.querySelector('.modal .updprog')) showUpdateModal();
    setTimeout(() => checkUpdate(), 1200);
  } else if (u.busy) setTimeout(() => checkUpdate(), 4000); // цаана нь татаж байна
  const l = u.latest;
  if (u.staged && !installing && pref('updDismissStaged', '') !== u.staged) {
    bar.hidden = false;
    bar.innerHTML = `<div><b>Шинэ хувилбар ${esc(u.staged)}</b> татагдаж бэлэн боллоо <span class="muted">— дараагийн асалтад автоматаар суулгана</span></div>
      <button class="btn fill" id="updNow">Одоо дахин асаах</button><button class="icon x" id="updX" title="Дараа асаахад суулгана">✕</button>`;
    $('#updNow').onclick = showUpdateModal;
    $('#updX').onclick = () => { bar.hidden = true; setPref('updDismissStaged', u.staged); };
  } else if (l && l.available && u.busy && !installing) {
    bar.hidden = false;
    bar.innerHTML = `<div><b>Шинэ хувилбар ${esc(l.version)}</b> <span class="muted">цаана нь татаж байна… ${u.total ? Math.round(u.done / u.total * 100) + '%' : ''}</span></div>`;
  } else if (l && l.available && !u.busy && !u.staged && pref('updDismiss', '') !== l.version) {
    bar.hidden = false;
    bar.innerHTML = `<div><b>Шинэ хувилбар ${esc(l.version)}</b> гарлаа <span class="muted">(одоо ${esc(u.current)})</span></div>
      <button class="btn fill" id="updSee">Үзэх</button><button class="icon x" id="updX" title="Одоохондоо үгүй">✕</button>`;
    $('#updSee').onclick = showUpdateModal;
    $('#updX').onclick = () => { bar.hidden = true; setPref('updDismiss', l.version); };
  } else if (!u.busy && !u.staged) bar.hidden = true;
  return u;
}
function showUpdateModal() {
  const u = window._upd || {}, l = u.latest || {};
  document.querySelector('.modal')?.remove();
  const ver = l.version || u.staged || '';
  const m = modal(`<h3>Шинэ хувилбар ${esc(ver)}</h3>
    <div class="muted">Одоогийн хувилбар: ${esc(u.current || '')}</div>
    ${l.notes ? `<div class="upd-notes">${esc(l.notes)}</div>` : ''}
    ${u.frozen ? `<p class="err">Энэ бол .exe/.app хувилбар тул автоматаар шинэчлэх боломжгүй. ${l.page ? `<a href="${esc(l.page)}" target="_blank" style="color:var(--pink2)">Татах хуудас нээх</a>` : 'Шинэ хувилбарыг татаж суулгана уу.'}</p>` : `<p class="muted" style="font-size:12.5px">Номын сан, тохиргоо, өргөтгөлүүд хэвээр үлдэнэ. Шинэчилсний дараа програм дахин асна.</p>`}
    <div id="updState"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" id="updLater">Дараа</button>
      ${u.frozen ? (l.page ? `<button class="btn fill" onclick="IZopen('${esc(l.page)}')">Татах хуудас</button>` : '') : `<button class="btn fill" id="updGo">${u.staged ? '⟳ Одоо дахин асааж суулгах' : '⬇ Шинэчлэх'}</button>`}</div>`);
  m.querySelector('#updLater').onclick = () => m.remove();
  const go = m.querySelector('#updGo');
  if (go) go.onclick = async () => {
    go.disabled = true; m.querySelector('#updLater').disabled = true;
    try { await api('/update', {method: 'POST', body: {apply: true}}); } catch (e) { m.querySelector('#updState').innerHTML = `<div class="err">${esc(e.message)}</div>`; go.disabled = false; return; }
    pollInstall(m);
  };
  if (u.busy && u.mode === 'install') pollInstall(m);
}
async function pollInstall(m) {
  const st = m.querySelector('#updState'); m.querySelector('#updGo')?.setAttribute('disabled', '1'); m.querySelector('#updLater')?.setAttribute('disabled', '1');
  const tick = async () => {
    let u;
    try { u = await api('/update'); } catch (e) { st.innerHTML = '<div class="updprog"><i style="width:100%"></i></div><div class="muted">Дахин асааж байна… Хэдэн секундын дараа хуудсаа сэргээнэ үү.</div>'; setTimeout(() => location.reload(), 4000); return; }
    window._upd = u;
    if (u.error) { st.innerHTML = `<div class="err">${esc(u.error)}</div>`; const g = m.querySelector('#updGo'); if (g) { g.disabled = false; } m.querySelector('#updLater').disabled = false; return; }
    const pct = u.total ? Math.round(u.done / u.total * 100) : (u.phase ? 30 : 0);
    st.innerHTML = `<div class="updprog"><i style="width:${u.ready ? 100 : pct}%"></i></div><div class="muted">${esc(u.phase || 'Эхлүүлж байна')}${u.total && !u.ready ? ` — ${(u.done/1048576).toFixed(1)}/${(u.total/1048576).toFixed(1)} MB` : ''}</div>`;
    if (u.ready) { st.innerHTML = '<div class="updprog"><i style="width:100%"></i></div><div class="ok">Шинэчиллээ. Дахин асааж байна… 5 секундын дараа хуудас сэргэнэ.</div>'; setTimeout(() => location.reload(), 5000); return; }
    setTimeout(tick, 900);
  };
  tick();
}
window.IZopen = u => { try { window.open(u, '_blank'); } catch (e) {} };
setInterval(badges, 4000); badges();
checkUpdate(); setInterval(engDot, 3000); engDot();
route();
</script>
</body>
</html>
